name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (for plugin validate and the smoke test)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate manifest and every pinned plugin
        run: scripts/check
      - name: Fresh-home install of every plugin
        run: scripts/smoke-test
